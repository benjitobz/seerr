---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Books Deploy Image

# Builds books-deploy, the branch this fork is deployed from, and pushes it to
# GHCR. It only exists on books-deploy, so syncing seerr-team or jabloink can
# never start it, and none of their workflows run for this branch.
# The branch name becomes the image tag, so it must stay free of slashes.
on:
  push:
    branches:
      - books-deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Build details
        id: details
        run: |
          echo "timestamp=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.details.outputs.timestamp }}
          tags: |
            ${{ steps.details.outputs.image }}:${{ github.ref_name }}
            ${{ steps.details.outputs.image }}:sha-${{ steps.details.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=books-deploy
          cache-to: type=gha,mode=max,scope=books-deploy
          provenance: false
